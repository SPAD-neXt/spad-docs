backend:
  name: github
  repo: SPAD-neXt/spad-docs
  branch: main
  # Decap appends /auth and /callback to this. Must be a bare origin, no
  # path: decap-cms-lib-auth's netlify-auth.js checks incoming postMessage
  # events with `e.origin === this.base_url`, and a postMessage event's
  # `origin` is always scheme+host+port with no path - a base_url with a
  # path segment can never match, silently breaking every login. The
  # provider itself (cms-server) runs on the same VM as the site,
  # reverse-proxied at domain root (/auth, /callback) - see SPAD-Migration
  # serverfarm/pve3/vms/web/cms-server/.
  base_url: https://docs.spadnext.net
  auth_endpoint: auth
  # Editors without Write access get an automatic fork + PR instead of a
  # direct branch; both land as a normal PR against `main`, reviewed the
  # same way (see .github/workflows/auto-merge.yml).
  open_authoring: true
  # spad-docs is public, so the narrower scope is enough; without this,
  # open_authoring makes the CMS ask GitHub for access to ALL of a
  # contributor's repos including private ones.
  auth_scope: public_repo

publish_mode: editorial_workflow

media_folder: static/img/assets
public_folder: /img/assets

collections:
  - name: docs
    label: Documentation
    label_singular: Doc page
    folder: docs
    extension: mdx
    format: frontmatter
    create: true
    delete: true
    # Recurse into the whole docs/ tree (34 folders deep in places, mirrors
    # SPAD.next-docs' original GitBook structure). `index_file` treats each
    # folder's README.mdx as that folder's own entry rather than a separate
    # nested doc, matching how Docusaurus already treats README.mdx as a
    # folder's category page.
    #
    # subfolders: false is required for our folder shape. Sveltia's default
    # (subfolders: true) assumes "a folder IS an entry" - every file has its
    # own child folder, and a folder with no subfolder of its own is treated
    # as a leaf and dropped from the sidebar tree entirely. Our folders mix
    # a README.mdx index with sibling page files and, further down, more
    # subfolders (e.g. docs/guides-and-videos has 5 direct pages plus 2
    # subfolders) - the classic "files are files, folders are just
    # containers" shape - which is exactly what subfolders: false is for.
    # Without it, folders with no child subfolder of their own vanish from
    # the tree and their pages get hoisted up into the collection root.
    nested:
      depth: 100
      summary: '{{title}}'
      subfolders: false
    meta:
      path:
        widget: string
        label: Path
        index_file: README
    fields:
      - { label: Title, name: title, widget: string, required: false }
      - { label: Description, name: description, widget: string, required: false }
      - label: Sidebar Position
        name: sidebar_position
        widget: number
        required: false
        # Decap's number widget defaults to integer-only; float allows
        # decimals like 2.5 to slot a page between existing 2 and 3 without
        # renumbering every sibling - see the editor guide.
        value_type: float
        hint: >-
          Controls ordering among sibling pages in this same folder (lower
          number shows first). Leave empty to sort last. See the docs
          maintainer guide for how this maps to what you'd drag-and-drop in
          GitBook.
      - { label: Body, name: body, widget: markdown }
