name: Auto-merge trusted collaborators

# Merges a PR automatically once its Build Check passed, but only if BOTH:
# - the PR author has Write permission or higher on this repo (the operator's
#   decision: "Write or higher" counts as a trusted collaborator), and
# - every changed file is under docs/ or static/img/ (the only paths the CMS
#   itself ever touches) or is exactly static/spad-next-manual.pdf (the
#   weekly PDF export cron job's one output file). A trusted author's PR that
#   also touches scripts/, CSS, workflows, config.yml, etc. always needs a
#   human look; auto-merge has no way to review the actual diff, only who
#   opened it.
# Anyone else - including editors using Decap's `open_authoring` fork-based
# workflow, who by definition don't have write access - gets left alone for a
# human collaborator to review and merge manually either way.
#
# Deliberately triggered by `workflow_run` (after Build Check finishes)
# instead of reacting to `pull_request` directly, and deliberately does not
# check out any PR/fork code itself. This is the standard safe pattern for
# "take a privileged action based on the result of running untrusted PR
# code": `workflow_run` always executes using the workflow file from the
# repo's default branch, and a PR - however malicious - can't use this
# workflow to grant itself elevated permissions or merge rights by editing
# auto-merge.yml in its own branch, because that edited copy is never what
# runs here.
#
# `workflow_run`'s own `pull_requests` payload field is only populated for
# same-repo PRs, not for forks (a known GitHub limitation) - so the
# associated PR is looked up via the commit-pulls API instead, which works
# for both.
#
# Whenever a PR is NOT auto-merged (failed build, author below Write, files
# outside the allowed paths) the workflow leaves one comment on the PR saying
# why, so it shows up in notifications/tracking. The comment carries a hidden
# marker and is updated in place on later runs instead of piling up; it is
# deleted again right before a merge.

on:
  workflow_run:
    workflows: ["Build Check"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Find the PR for this build, check author permission, merge if trusted
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.workflow_run.head_sha;
            const conclusion = context.payload.workflow_run.conclusion;
            if (conclusion !== 'success' && conclusion !== 'failure' && conclusion !== 'timed_out') {
              core.info(`Build Check concluded '${conclusion}' - nothing to do.`);
              return;
            }

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: headSha,
            });
            const pr = prs.find((p) => p.state === 'open');
            if (!pr) {
              core.info(`No open PR found for commit ${headSha} - nothing to do.`);
              return;
            }

            const MARKER = '<!-- auto-merge-status -->';
            const findStatusComment = async () => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });
              return comments.find((c) => c.body && c.body.includes(MARKER));
            };
            const notifyNotMerged = async (reason) => {
              core.info(`PR #${pr.number} not auto-merged: ${reason}`);
              const body = `${MARKER}\n**Not auto-merged:** ${reason}\n\nThis PR needs a manual review and merge.`;
              const existing = await findStatusComment();
              if (existing) {
                if (existing.body !== body) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                    body,
                  });
                }
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
              }
            };

            if (pr.draft) {
              // Build Check itself skips while a PR is a draft (see build-check.yml), so this is
              // normally unreachable - but a PR merged into draft-skip support with an
              // already-"success" run from before that change still triggers this workflow, and
              // the merge API hard-rejects a draft PR with a 405 ("Pull Request is still a draft"),
              // failing this whole run. Confirmed live on spad-docs#13.
              core.info(`PR #${pr.number} is still a draft - leaving it alone.`);
              return;
            }

            if (conclusion !== 'success') {
              await notifyNotMerged(`the Build Check ${conclusion === 'failure' ? 'failed' : 'timed out'}.`);
              return;
            }

            const author = pr.user.login;
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: author,
            });
            core.info(`PR #${pr.number} author ${author} has permission: ${perm.permission}`);

            const trusted = perm.permission === 'admin' || perm.permission === 'write';
            if (!trusted) {
              await notifyNotMerged(`the author ${author} has no Write access to this repo.`);
              return;
            }

            // Even a trusted author's PR only auto-merges when it is pure content: everything
            // changed lives under docs/ or static/img/ (what the CMS itself ever touches), or is
            // the one generated PDF export file. Anything else - scripts/, CSS, workflows,
            // config.yml, etc. - always needs a human look, even from a Write-access account, since
            // auto-merge has no way to review the actual diff.
            const ALLOWED_PREFIXES = ['docs/', 'static/img/'];
            // Exact file, not a prefix: the weekly PDF export cron job (vm-mgmt, see
            // SPAD-Migration serverfarm/pve1/vms/vm-mgmt/) commits only this one path - a prefix
            // like `static/` would also wave through any other file dropped under it.
            const ALLOWED_EXACT_PATHS = ['static/spad-next-manual.pdf'];
            const isAllowedPath = (path) =>
              ALLOWED_PREFIXES.some((prefix) => path.startsWith(prefix)) ||
              ALLOWED_EXACT_PATHS.includes(path);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const outOfScope = files.filter(
              (file) =>
                !isAllowedPath(file.filename) ||
                (file.previous_filename && !isAllowedPath(file.previous_filename)),
            );

            if (outOfScope.length > 0) {
              await notifyNotMerged(
                `the PR changes files outside docs/ and static/img/: ${outOfScope
                  .map((f) => `\`${f.filename}\``)
                  .join(', ')}.`,
              );
              return;
            }

            const stale = await findStatusComment();
            if (stale) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: stale.id,
              });
            }

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'squash',
            });
            core.info(`Merged PR #${pr.number} (author ${author}, permission ${perm.permission}).`);
