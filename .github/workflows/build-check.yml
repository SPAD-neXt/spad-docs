name: Build Check

# Runs on every PR, including ones from forks (Decap's `open_authoring`
# workflow opens forked PRs for editors without write access). Uses the
# default, restricted, read-only GITHUB_TOKEN and never checks out anything
# beyond the PR's own code - safe to run untrusted content.
#
# Configure this as a required status check on `main` in the repo's branch
# protection settings (Settings -> Branches -> Branch protection rules) so
# it actually gates merges, including the auto-merge workflow
# (auto-merge.yml), which waits for this workflow's conclusion.

on:
  pull_request:
    branches: [main]
    # `ready_for_review` is not one of the default types (opened, synchronize,
    # reopened) - without it, the one push that actually matters (draft ->
    # ready) wouldn't trigger this workflow at all.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    # Sveltia's editorial workflow keeps a PR as a real GitHub draft PR for
    # as long as the CMS entry's own status is "draft", committing (and thus
    # re-triggering this workflow via `synchronize`) on every single save -
    # which would otherwise run a full npm ci + build for every keystroke-
    # level autosave on a large edit. Skip while still a draft; the
    # `ready_for_review` transition above re-triggers a real run once the
    # editor actually asks for review, which is also what gates auto-merge.yml
    # (it only reacts when this job's conclusion is "success", never
    # "skipped").
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
